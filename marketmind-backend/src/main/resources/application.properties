# MarketMind MA - Spring Boot Configuration

# Application
spring.application.name=marketmind-backend
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/marketmind
spring.datasource.username=marketmind
spring.datasource.password=marketmind123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=marketmind

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JWT Configuration
marketmind.jwt.secret=${MARKETMIND_JWT_SECRET:marketmindSecretKey2024ForJwtTokenGenerationAndValidation}
marketmind.jwt.expiration=86400000

# NLP Service Configuration
marketmind.nlp.service.url=http://localhost:8000

# Data Collectors Configuration
marketmind.collectors.reddit.enabled=true
marketmind.collectors.reddit.subreddits=morocco,Casablanca,MoroccoTech,startups

marketmind.collectors.rss.enabled=true

marketmind.collectors.hackernews.enabled=true

marketmind.collectors.medium.enabled=false

marketmind.collectors.bladi.enabled=false

marketmind.collectors.developpez.enabled=false

marketmind.collectors.twitter.enabled=false

# Logging
logging.level.com.marketmind=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Casablanca

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
